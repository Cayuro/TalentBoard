spring.application.name=talentboard

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talentboard}
spring.datasource.username=${DB_USERNAME:talentboard}
spring.datasource.password=${DB_PASSWORD:talentboard}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Thymeleaf
spring.thymeleaf.cache=false

# Server
server.port=${PORT:8080}

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
