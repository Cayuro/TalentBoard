<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - My Applications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
  <div th:replace="~{fragments/messages :: messages}"></div>

  <h4 class="fw-bold mb-3">My Applications</h4>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr><th>#</th><th>Vacancy</th><th>Applied</th><th>Status</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="a : ${applications}">
          <td th:text="${a.id()}"></td>
          <td th:text="${a.vacancyTitle()}"></td>
          <td th:text="${a.applicationDate()}"></td>
          <td>
            <span class="badge"
                  th:classappend="${a.status().name() == 'HIRED'} ? 'bg-success' :
                                  (${a.status().name() == 'REJECTED'} ? 'bg-danger' : 'bg-info text-dark')"
                  th:text="${a.status()}"></span>
          </td>
          <td>
            <a th:href="@{/applications/{id}(id=${a.id()})}" class="btn btn-sm btn-outline-secondary">Detail</a>
          </td>
        </tr>
        <tr th:if="${applications.empty}">
          <td colspan="5" class="text-center text-muted">You have not applied to any vacancies yet.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
