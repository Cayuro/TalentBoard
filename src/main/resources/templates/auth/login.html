<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center mb-4 fw-bold">
      <span class="text-warning">Talent</span>Board
    </h3>

    <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
    <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>
    <div th:if="${param.registered}" class="alert alert-success">Account created! Please log in.</div>

    <form th:action="@{/auth/login}" method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Email</label>
        <input type="email" id="username" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-warning w-100 fw-bold">Login</button>
    </form>

    <hr>
    <p class="text-center mb-0">
      Don't have an account? <a th:href="@{/auth/register}">Register</a>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
