<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
  <div th:replace="~{fragments/messages :: messages}"></div>

  <div class="row mb-4">
    <div class="col">
      <h4 class="fw-bold">Welcome, <span th:text="${currentUser.firstName()}">User</span>!</h4>
      <span class="badge bg-warning text-dark" th:text="${currentUser.role()}">ROLE</span>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm text-center p-3">
        <div class="fs-1 fw-bold text-warning" th:text="${openVacancies.size()}">0</div>
        <div class="text-muted">Open Vacancies</div>
      </div>
    </div>
  </div>

  <h5 class="fw-bold mb-3">Open Vacancies</h5>
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>#</th><th>Title</th><th>Category</th><th>Work Mode</th><th>Salary</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="v : ${openVacancies}">
          <td th:text="${v.id()}"></td>
          <td th:text="${v.title()}"></td>
          <td th:text="${v.category()}"></td>
          <td><span class="badge bg-secondary" th:text="${v.workMode()}"></span></td>
          <td>
            <span th:if="${v.salaryMin() != null}"
                  th:text="${'$' + v.salaryMin() + ' - $' + v.salaryMax()}"></span>
            <span th:unless="${v.salaryMin() != null}" class="text-muted">Not specified</span>
          </td>
          <td>
            <a th:href="@{/vacancies/{id}(id=${v.id()})}" class="btn btn-sm btn-outline-warning">View</a>
          </td>
        </tr>
        <tr th:if="${openVacancies.empty}">
          <td colspan="6" class="text-center text-muted">No open vacancies at this time.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
