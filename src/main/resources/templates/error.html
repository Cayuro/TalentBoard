<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="card border-0 shadow-lg" style="max-width: 640px; width: 100%;">
    <div class="card-body p-5 text-center">
      <div class="badge bg-warning text-dark mb-3 fs-6">TalentBoard</div>

      <h1 class="display-4 fw-bold mb-2" th:text="${status}">500</h1>
      <h5 class="text-muted mb-4" th:text="${error}">Internal Server Error</h5>

      <p class="text-muted mb-1">
        <span th:if="${message}" th:text="${message}">An unexpected error occurred.</span>
        <span th:unless="${message}">An unexpected error occurred. Please try again.</span>
      </p>
      <p class="text-secondary small mb-4" th:if="${path}">
        Path: <code th:text="${path}">/</code>
      </p>

      <div class="d-flex gap-2 justify-content-center">
        <a href="/dashboard" class="btn btn-warning fw-bold">Go to dashboard</a>
        <a href="/vacancies" class="btn btn-outline-secondary">View vacancies</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
