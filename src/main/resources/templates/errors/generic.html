<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  <div class="card border-0 shadow-lg" style="max-width: 720px; width: 100%;">
    <div class="card-body p-5">
      <div class="badge bg-warning text-dark mb-3">TalentBoard</div>
      <h1 class="fw-bold mb-3" th:text="${errorTitle}">Something went wrong</h1>
      <p class="text-muted mb-4" th:text="${errorMessage}">
        We could not complete your request.
      </p>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="border rounded-3 p-3 bg-white">
            <div class="text-uppercase text-muted small">Requested path</div>
            <div class="fw-semibold" th:text="${requestPath}">/path</div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="border rounded-3 p-3 bg-white">
            <div class="text-uppercase text-muted small">Suggested action</div>
            <div class="fw-semibold" th:text="${suggestion}">Go back and try again</div>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <a th:href="@{/dashboard}" class="btn btn-warning fw-bold">Go to dashboard</a>
        <a th:href="@{/vacancies}" class="btn btn-outline-secondary">View vacancies</a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
