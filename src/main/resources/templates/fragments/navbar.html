<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/dashboard">
      <span class="text-warning">Talent</span>Board
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/vacancies}">Vacancies</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('CANDIDATE')">
          <a class="nav-link" th:href="@{/applications}">My Applications</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','RECRUITER')">
          <a class="nav-link" th:href="@{/interviews}">My Interviews</a>
        </li>
        <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','RECRUITER')">
          <a class="nav-link" th:href="@{/vacancies/new}">+ New Vacancy</a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" sec:authentication="name">
            User
          </a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <form th:action="@{/auth/logout}" method="post">
                <button type="submit" class="dropdown-item">Logout</button>
              </form>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
</body>
</html>
