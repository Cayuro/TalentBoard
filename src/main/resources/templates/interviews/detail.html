<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - Interview Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 900px;">
  <a th:href="@{/applications/{id}(id=${interview.applicationId()})}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to application</a>

  <div th:replace="~{fragments/messages :: messages}"></div>

  <div class="card shadow-sm border-0">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
      <div>
        <div class="text-uppercase small opacity-75">Interview</div>
        <h5 class="mb-0 fw-bold" th:text="${interview.interviewType()}">Type</h5>
      </div>
      <span class="badge fs-6"
            th:classappend="${interview.result().name() == 'PASSED' ? 'bg-success' :
                             (interview.result().name() == 'FAILED' ? 'bg-danger' :
                             (interview.result().name() == 'NO_SHOW' ? 'bg-warning text-dark' : 'bg-secondary'))}"
            th:text="${interview.result()}">PENDING</span>
    </div>

    <div class="card-body">
      <div class="row g-4">
        <div class="col-md-6">
          <div class="border rounded-3 p-3 h-100 bg-light">
            <h6 class="fw-bold mb-3">Interview Details</h6>
            <dl class="row mb-0">
              <dt class="col-5 text-muted">Date</dt>
              <dd class="col-7 mb-2" th:text="${interview.interviewDate()}">2026-01-01</dd>

              <dt class="col-5 text-muted">Time</dt>
              <dd class="col-7 mb-2" th:text="${interview.interviewTime()}">10:00</dd>

              <dt class="col-5 text-muted">Type</dt>
              <dd class="col-7 mb-2">
                <span class="badge bg-secondary" th:text="${interview.interviewType()}"></span>
              </dd>

              <dt class="col-5 text-muted">Result</dt>
              <dd class="col-7 mb-0">
                <span class="badge"
                      th:classappend="${interview.result().name() == 'PASSED' ? 'bg-success' :
                                       (interview.result().name() == 'FAILED' ? 'bg-danger' :
                                       (interview.result().name() == 'NO_SHOW' ? 'bg-warning text-dark' : 'bg-secondary'))}"
                      th:text="${interview.result()}"></span>
              </dd>
            </dl>
          </div>
        </div>

        <div class="col-md-6">
          <div class="border rounded-3 p-3 h-100 bg-light">
            <h6 class="fw-bold mb-3">People</h6>
            <dl class="row mb-0">
              <dt class="col-5 text-muted">Candidate</dt>
              <dd class="col-7 mb-2" th:text="${interview.candidateFirstName() + ' ' + interview.candidateLastName()}">Name</dd>

              <dt class="col-5 text-muted">Recruiter</dt>
              <dd class="col-7 mb-0" th:text="${interview.recruiterFirstName() + ' ' + interview.recruiterLastName()}">Name</dd>
            </dl>
          </div>
        </div>
      </div>

      <div class="mt-4">
        <h6 class="fw-bold">Observations</h6>
        <div class="border rounded-3 p-3 bg-white">
          <p class="mb-0 text-muted" th:if="${interview.observations() == null or interview.observations().isBlank()}">
            No observations recorded for this interview.
          </p>
          <p class="mb-0" th:unless="${interview.observations() == null or interview.observations().isBlank()}"
             th:text="${interview.observations()}"></p>
        </div>
      </div>

      <div class="mt-4" sec:authorize="hasAnyRole('ADMIN','RECRUITER')"
           th:if="${interview.result().name() == 'PENDING'}">
        <h6 class="fw-bold">Register Result</h6>
        <div class="card border-0 bg-light p-3">
          <form th:action="@{/interviews/{id}/result(id=${interview.id()})}" method="post">
            <div class="mb-3">
              <label for="result" class="form-label fw-semibold">Result</label>
              <select id="result" name="result" class="form-select" required>
                <option th:each="r : ${interviewResults}"
                        th:value="${r.name()}"
                        th:text="${r.name()}"
                        th:selected="${r.name() == interview.result().name()}"></option>
              </select>
            </div>
            <div class="mb-3">
              <label for="observations" class="form-label fw-semibold">Observations <span class="text-muted fw-normal">(optional)</span></label>
              <textarea id="observations" name="observations" class="form-control" rows="3"
                        th:text="${interview.observations()}"></textarea>
            </div>
            <button type="submit" class="btn btn-warning fw-bold">Register Result</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
