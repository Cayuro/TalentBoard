<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - My Interviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
  <div th:replace="~{fragments/messages :: messages}"></div>

  <h4 class="fw-bold mb-3">My Scheduled Interviews</h4>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Time</th>
          <th>Type</th>
          <th>Candidate</th>
          <th>Result</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="i : ${interviews}">
          <td th:text="${i.id()}"></td>
          <td th:text="${i.interviewDate()}"></td>
          <td th:text="${i.interviewTime()}"></td>
          <td><span class="badge bg-secondary" th:text="${i.interviewType()}"></span></td>
          <td th:text="${i.candidateFirstName() + ' ' + i.candidateLastName()}"></td>
          <td>
            <span class="badge"
                  th:classappend="${i.result().name() == 'PASSED' ? 'bg-success' :
                                   (i.result().name() == 'FAILED' ? 'bg-danger' :
                                   (i.result().name() == 'NO_SHOW' ? 'bg-warning text-dark' : 'bg-secondary'))}"
                  th:text="${i.result()}"></span>
          </td>
          <td>
            <a th:href="@{/interviews/{id}(id=${i.id()})}" class="btn btn-sm btn-outline-secondary">View</a>
            <a th:href="@{/applications/{id}(id=${i.applicationId()})}" class="btn btn-sm btn-outline-primary ms-1">Application</a>
          </td>
        </tr>
        <tr th:if="${interviews == null or interviews.empty}">
          <td colspan="7" class="text-center text-muted">No interviews scheduled yet.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
