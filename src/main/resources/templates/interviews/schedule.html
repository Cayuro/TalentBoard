<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - Schedule Interview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 700px;">
  <a th:href="@{/applications/{id}(id=${application.id()})}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to application</a>

  <div th:replace="~{fragments/messages :: messages}"></div>

  <div class="card shadow-sm border-0">
    <div class="card-header bg-dark text-white">
      <div class="text-uppercase small opacity-75">Schedule Interview</div>
      <h5 class="mb-0 fw-bold" th:text="${application.vacancyTitle()}">Vacancy title</h5>
      <div class="small mt-1 opacity-75">
        Candidate: <span th:text="${application.candidateFirstName() + ' ' + application.candidateLastName()}"></span>
      </div>
    </div>

    <div class="card-body">
      <form th:action="@{/interviews/application/{id}(id=${application.id()})}" method="post">
        <input type="hidden" name="applicationId" th:value="${application.id()}">

        <div class="mb-3">
          <label for="interviewDate" class="form-label fw-semibold">Interview Date</label>
          <input type="date" id="interviewDate" name="interviewDate" class="form-control"
                 th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
        </div>

        <div class="mb-3">
          <label for="interviewTime" class="form-label fw-semibold">Interview Time</label>
          <input type="time" id="interviewTime" name="interviewTime" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="interviewType" class="form-label fw-semibold">Interview Type</label>
          <select id="interviewType" name="interviewType" class="form-select" required>
            <option value="" disabled selected>Select type...</option>
            <option th:each="type : ${interviewTypes}"
                    th:value="${type.name()}"
                    th:text="${type.name()}"></option>
          </select>
        </div>

        <div class="mb-4">
          <label for="observations" class="form-label fw-semibold">Observations <span class="text-muted fw-normal">(optional)</span></label>
          <textarea id="observations" name="observations" class="form-control" rows="3"
                    placeholder="Agenda, notes or preparation details..."></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-warning fw-bold">Schedule Interview</button>
          <a th:href="@{/applications/{id}(id=${application.id()})}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
