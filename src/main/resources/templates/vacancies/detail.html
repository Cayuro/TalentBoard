<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - Vacancy Detail</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 800px;">
  <a th:href="@{/vacancies}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back</a>

  <div th:replace="~{fragments/messages :: messages}"></div>

  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fw-bold" th:text="${vacancy.title()}">Title</h5>
      <span class="badge fs-6"
            th:classappend="${vacancy.status().name() == 'OPEN'} ? 'bg-success' : 'bg-secondary'"
            th:text="${vacancy.status()}"></span>
    </div>
    <div class="card-body">
      <dl class="row">
        <dt class="col-sm-3">Category</dt>
        <dd class="col-sm-9" th:text="${vacancy.category()}"></dd>

        <dt class="col-sm-3">Work Mode</dt>
        <dd class="col-sm-9"><span class="badge bg-secondary" th:text="${vacancy.workMode()}"></span></dd>

        <dt class="col-sm-3">Salary</dt>
        <dd class="col-sm-9">
          <span th:if="${vacancy.salaryMin() != null}"
                th:text="${'$' + vacancy.salaryMin() + ' – $' + vacancy.salaryMax()}"></span>
          <span th:unless="${vacancy.salaryMin() != null}" class="text-muted">Not specified</span>
        </dd>

        <dt class="col-sm-3">Published</dt>
        <dd class="col-sm-9" th:text="${vacancy.publicationDate()}"></dd>

        <dt class="col-sm-3">Recruiter</dt>
        <dd class="col-sm-9" th:text="${vacancy.recruiterFirstName() + ' ' + vacancy.recruiterLastName()}"></dd>

        <dt class="col-sm-3">Description</dt>
        <dd class="col-sm-9" th:text="${vacancy.description()}"></dd>
      </dl>

      <div class="mt-3" sec:authorize="hasRole('CANDIDATE')">
        <form th:action="@{/applications}" method="post">
          <input type="hidden" name="vacancyId" th:value="${vacancy.id()}">
          <button type="submit" class="btn btn-warning fw-bold"
                  th:disabled="${vacancy.status().name() != 'OPEN'}">Apply Now</button>
        </form>
      </div>
    </div>
  </div>

  <div sec:authorize="hasAnyRole('ADMIN','RECRUITER')" class="mt-4">
    <h6 class="fw-bold">Applications (<span th:text="${applications.size()}">0</span>)</h6>
    <table class="table table-sm table-hover">
      <thead class="table-light">
        <tr><th>Candidate</th><th>Date</th><th>Status</th></tr>
      </thead>
      <tbody>
        <tr th:each="a : ${applications}">
          <td th:text="${a.candidateFirstName() + ' ' + a.candidateLastName()}"></td>
          <td th:text="${a.applicationDate()}"></td>
          <td><span class="badge bg-info text-dark" th:text="${a.status()}"></span></td>
        </tr>
        <tr th:if="${applications.empty}">
          <td colspan="3" class="text-muted text-center">No applications yet.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
