<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - Edit Vacancy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 700px;">
  <a th:href="@{/vacancies/{id}(id=${vacancy.id()})}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to vacancy</a>
  <h4 class="fw-bold mb-4">Edit Vacancy</h4>

  <div th:replace="~{fragments/messages :: messages}"></div>

  <form th:action="@{/vacancies/{id}/edit(id=${vacancy.id()})}" method="post">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label fw-semibold">Title *</label>
        <input type="text" name="title" class="form-control"
               th:value="${vacancy.title()}" required>
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold">Description *</label>
        <textarea name="description" class="form-control" rows="4"
                  required th:text="${vacancy.description()}"></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Category *</label>
        <input type="text" name="category" class="form-control"
               th:value="${vacancy.category()}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Work Mode *</label>
        <select name="workMode" class="form-select" required>
          <option th:each="m : ${workModes}"
                  th:value="${m}"
                  th:text="${m}"
                  th:selected="${m == vacancy.workMode()}"></option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Min Salary</label>
        <input type="number" name="salaryMin" class="form-control" step="0.01"
               th:value="${vacancy.salaryMin()}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Max Salary</label>
        <input type="number" name="salaryMax" class="form-control" step="0.01"
               th:value="${vacancy.salaryMax()}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Status *</label>
        <select name="status" class="form-select" required>
          <option th:each="s : ${statuses}"
                  th:value="${s}"
                  th:text="${s}"
                  th:selected="${s == vacancy.status()}"></option>
        </select>
      </div>
      <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-warning fw-bold">Save Changes</button>
        <a th:href="@{/vacancies/{id}(id=${vacancy.id()})}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
