<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalentBoard - New Vacancy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 700px;">
  <h4 class="fw-bold mb-4">New Vacancy</h4>
  <form th:action="@{/vacancies}" method="post">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label fw-semibold">Title *</label>
        <input type="text" name="title" class="form-control" required>
      </div>
      <div class="col-12">
        <label class="form-label fw-semibold">Description *</label>
        <textarea name="description" class="form-control" rows="4" required></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Category *</label>
        <input type="text" name="category" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Work Mode *</label>
        <select name="workMode" class="form-select" required>
          <option th:each="m : ${workModes}" th:value="${m}" th:text="${m}"></option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Min Salary</label>
        <input type="number" name="salaryMin" class="form-control" step="0.01">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Max Salary</label>
        <input type="number" name="salaryMax" class="form-control" step="0.01">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Status *</label>
        <select name="status" class="form-select" required>
          <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
        </select>
      </div>
      <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-warning fw-bold">Create Vacancy</button>
        <a th:href="@{/vacancies}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </div>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
